name: Windows

# The port under windows/ is Rust, and CI and Package only ever run Xcode, so a
# Windows change could merge on a green check that never compiled it. Its own
# file, so those two stay about the Mac app.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  # Required checks must also run on documentation-only pull requests.
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      # First, and quick: cargo never reads the pages, so a syntax error in
      # their script stays green through the build and ships as an empty
      # window. Node is already on the runner.
      - name: Check the UI pages parse
        run: node scripts/check-ui-scripts.mjs

      - name: Test update controls
        run: node scripts/test-update-ui.cjs

      - name: Test light surface theme
        run: node --test test-light-surface.cjs

      - name: Test the carried notch's spring and border
        run: node --test test-carry.cjs

      - name: Test Claude sign-in controls
        run: node scripts/test-claude-auth-ui.cjs

      - name: Test Korean card localization
        run: node --test scripts/test-ko-i18n.cjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri and the windows crate make a cold build several minutes long.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Test Kiro ring and fork updates
        run: node --test test-kiro.cjs scripts/test-fork-updates.cjs

      - name: Test credits, presentation, telemetry, privacy and working pace
        run: node --test test-kiro-credits.cjs test-provider-presentation.cjs test-telemetry-ui.cjs test-activity-privacy.cjs test-work-pace.cjs

      - name: Test Codex headline selection
        run: node --test test-codex-headline.cjs

      # Reported rather than enforced: the crate already carries warnings, and
      # failing on them would hold every change hostage to that cleanup.
      - name: Clippy
        run: cargo clippy --all-targets --locked

  # The same crate builds on Linux, where the Win32 paths compile out. Kept to a
  # build and the tests: there is no runner with a desktop to show a notch on.
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
                                  libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: linux

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
